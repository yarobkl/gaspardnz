name: iOS UI — Validation (sans déploiement)
on:
  push:
    branches:
      - feature/build15-journal-editorial
      - feature/build16-native-polish-20261104
      - feature/build17-fluid-gallery-nav
      - feature/build18-draggable-native-tab-pill
      - feature/build19-haptic-bubble
      - feature/build20-native-news-magazine
      - feature/build21-news-photo-crop-equal-cards
      - feature/build22-gallery-editorial-filters
      - feature/build23-gallery-vip-weddings
  pull_request:
    paths:
      - "src/**"
      - "tests/component/NativeExperience.test.jsx"
      - "tests/component/NativeServicesMobileCta.test.jsx"
      - "tests/component/GalleryNativeViewer.test.jsx"
      - "tests/component/NativeTabBarDrag.test.jsx"
      - "tests/component/NativeNewsMagazine.test.jsx"
      - "tests/unit/nativeTabHaptics.test.js"
      - "tests/api/whatsappNotification.test.js"
      - "tests/unit/nativePublicEvent.test.js"
      - "api/notify-whatsapp-contact.js"
      - "scripts/validate-admin-auth.mjs"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/ios-ui-validation.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test native tabs, translations and CRM lead routing
        run: npm run test:unit -- tests/component/NativeExperience.test.jsx tests/component/NativeServicesMobileCta.test.jsx tests/component/GalleryNativeViewer.test.jsx tests/component/NativeTabBarDrag.test.jsx tests/component/NativeNewsMagazine.test.jsx tests/unit/nativeTabHaptics.test.js
      - name: Test native Supabase CRM network transport
        run: npm run test:unit -- tests/unit/nativePublicEvent.test.js
      - name: Test native CRM notification CORS and source tracking
        run: npm run test:unit -- tests/api/whatsappNotification.test.js
      - name: Build native Capacitor web assets
        run: npm run build:app
      - name: Verify HTML and original uploaded portrait
        run: |
          test -s dist/index.html
          test -s "dist/images/Photo application .JPG"
