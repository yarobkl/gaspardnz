name: iOS — Build et TestFlight

on:
  push:
    branches:
      - main
      - codex/ios-app-store
      - feature/ios-premium-interface
      - feature/native-ios-editorial
      - feature/build15-journal-editorial
      - feature/build16-native-polish-20261104
      - feature/build17-fluid-gallery-nav
    paths:
      - ".github/workflows/ios-testflight.yml"
      - "ios/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
  workflow_dispatch:
    inputs:
      version:
        description: "Version publique (ex. 1.0.0)"
        required: true
        default: "1.0.0"
      buildNumber:
        description: "Numéro de build App Store (entier croissant)"
        required: true
        default: "1"
      uploadToTestFlight:
        description: "Signer et envoyer vers TestFlight"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APP_BUNDLE_ID: com.gaspardnz.app
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      GNZ_RELEASE_UPLOAD: ${{ (github.event_name == 'workflow_dispatch' && inputs.uploadToTestFlight) || (github.event_name == 'push' && github.ref == 'refs/heads/feature/build15-journal-editorial' && contains(github.event.head_commit.message, '[ship-gaspardnz-15]')) || (github.event_name == 'push' && github.ref == 'refs/heads/feature/build16-native-polish-20261104' && contains(github.event.head_commit.message, '[ship-gaspardnz-16]'))  || (github.event_name == 'push' && github.ref == 'refs/heads/feature/build17-fluid-gallery-nav' && contains(github.event.head_commit.message, '[ship-gaspardnz-17]')) }}
      GNZ_RELEASE_VERSION: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/feature/build17-fluid-gallery-nav' && contains(github.event.head_commit.message, '[ship-gaspardnz-17]') && '1.0.6') || (github.event_name == 'push' && github.ref == 'refs/heads/feature/build16-native-polish-20261104' && contains(github.event.head_commit.message, '[ship-gaspardnz-16]') && '1.0.5') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ship-gaspardnz-15]') && '1.0.4') || inputs.version || '1.0.0' }}
      GNZ_RELEASE_BUILD: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/feature/build17-fluid-gallery-nav' && contains(github.event.head_commit.message, '[ship-gaspardnz-17]') && '17') || (github.event_name == 'push' && github.ref == 'refs/heads/feature/build16-native-polish-20261104' && contains(github.event.head_commit.message, '[ship-gaspardnz-16]') && '16') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ship-gaspardnz-15]') && '15') || inputs.buildNumber || '1' }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Utiliser le Xcode stable le plus récent
        run: |
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -1)"
          test -n "$XCODE_APP"
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Construire et synchroniser Capacitor iOS
        run: npm run cap:sync:ios

      - name: Installer Python pour les icônes
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Préparer les icônes officielles GNZ sans transparence
        run: |
          python3 -m pip install Pillow
          python3 ios/scripts/prepare_app_icon.py

      - name: Appliquer la version iOS
        env:
          MARKETING_VERSION: ${{ env.GNZ_RELEASE_VERSION }}
          BUILD_NUMBER: ${{ env.GNZ_RELEASE_BUILD }}
        run: |
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $MARKETING_VERSION;/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj

      - name: Résoudre les dépendances Swift
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Compiler pour le simulateur
        if: ${{ env.GNZ_RELEASE_UPLOAD != 'true' }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Capturer l’écran d’accueil sur un simulateur iPhone
        id: capture
        if: ${{ env.GNZ_RELEASE_UPLOAD != 'true' }}
        timeout-minutes: 5
        continue-on-error: true
        run: |
          DEVICE_UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)["devices"]
          preferred=[]
          fallback=[]
          for runtime, devices in data.items():
              for device in devices:
                  if not device.get("isAvailable"): continue
                  row=(runtime, device["name"], device["udid"])
                  fallback.append(row)
                  if "iPhone 16 Pro Max" in device["name"]: preferred.append(row)
                  elif "iPhone" in device["name"] and "Pro Max" in device["name"]: preferred.append(row)
          rows=preferred or [r for r in fallback if "iPhone" in r[1]]
          print(sorted(rows, reverse=True)[0][2] if rows else "")')"
          test -n "$DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/App.app"
          test -d "$APP_PATH"
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_UDID" "$APP_BUNDLE_ID"
          sleep 8
          mkdir -p app-store-assets/screenshots
          xcrun simctl io "$DEVICE_UDID" screenshot app-store-assets/screenshots/iphone-home.png
          sips -g pixelWidth -g pixelHeight app-store-assets/screenshots/iphone-home.png

      - name: Conserver la capture App Store
        if: ${{ steps.capture.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: GaspardNZ-App-Store-Screenshot
          path: app-store-assets/screenshots/iphone-home.png
          if-no-files-found: error
          retention-days: 14

      - name: Vérifier les secrets Apple
        if: ${{ env.GNZ_RELEASE_UPLOAD == 'true' }}
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY CERTIFICATE_P12 CERTIFICATE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret manquant : $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Installer le certificat Apple Distribution
        if: ${{ env.GNZ_RELEASE_UPLOAD == 'true' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Installer la clé App Store Connect
        if: ${{ env.GNZ_RELEASE_UPLOAD == 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/appstoreconnect/private_keys" "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$RUNNER_TEMP/appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q '^-----BEGIN PRIVATE KEY-----'; then
            printf '%s' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          else
            printf '%s' "$ASC_PRIVATE_KEY" | tr -d '[:space:]' | openssl base64 -d -A > "$KEY_PATH"
          fi
          grep -q '^-----BEGIN PRIVATE KEY-----' "$KEY_PATH"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Télécharger le profil App Store renouvelé
        if: ${{ env.GNZ_RELEASE_UPLOAD == 'true' }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check "PyJWT[crypto]>=2.9,<3"
          python3 - "$RUNNER_TEMP/GaspardNZ-AppStore.mobileprovision" <<'PY'
          import base64
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          import jwt

          key_path = os.path.join(os.environ["RUNNER_TEMP"], "appstoreconnect",
                                  "private_keys", "AuthKey_" + os.environ["ASC_KEY_ID"] + ".p8")
          with open(key_path, "rb") as f:
              private_key = f.read()
          now = int(time.time())
          token = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": now,
               "exp": now + 600, "aud": "appstoreconnect-v1"},
              private_key, algorithm="ES256",
              headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"},
          )
          query = urllib.parse.urlencode({
              "filter[name]": "GaspardNZ App Store Distribution", "limit": "200"
          })
          req = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/profiles?" + query,
              headers={"Authorization": "Bearer " + token, "Accept": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=40) as response:
                  profiles = json.load(response)["data"]
          except urllib.error.HTTPError as error:
              raise SystemExit(
                  "::error::Téléchargement du profil App Store refusé par l'API Apple "
                  f"(HTTP {error.code}). Vérifier les droits de la clé App Store Connect."
              )
          matching = [
              p for p in profiles
              if p["attributes"].get("name") == "GaspardNZ App Store Distribution"
              and p["attributes"].get("profileState") == "ACTIVE"
              and p["attributes"].get("profileType") == "IOS_APP_STORE"
              and p["attributes"].get("profileContent")
          ]
          if len(matching) != 1:
              raise SystemExit(
                  "::error::Un profil App Store actif GaspardNZ unique est requis "
                  f"(trouvés : {len(matching)})."
              )
          content = base64.b64decode("".join(matching[0]["attributes"]["profileContent"].split()), validate=True)
          with open(sys.argv[1], "wb") as f:
              f.write(content)
          print("Profil App Store actif téléchargé depuis Apple Developer (contenu masqué).")
          PY
          security cms -D -i "$RUNNER_TEMP/GaspardNZ-AppStore.mobileprovision" > "$RUNNER_TEMP/renewed-profile.plist"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/renewed-profile.plist")"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/renewed-profile.plist")"
          APS="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/renewed-profile.plist")"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/renewed-profile.plist")"
          PROFILE_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/renewed-profile.plist")"
          test "$PROFILE_NAME" = 'GaspardNZ App Store Distribution'
          test "$APS" = 'production' || { echo "::error::Le profil renouvelé ne permet pas les Push de production."; exit 1; }
          test "$PROFILE_TEAM" = "$APPLE_TEAM_ID" || { echo "::error::Profil App Store d'une autre équipe Apple."; exit 1; }
          case "$APP_ID" in
            *.com.gaspardnz.app) ;;
            *) echo "::error::Profil App Store associé à un autre App ID."; exit 1 ;;
          esac
          python3 - "$RUNNER_TEMP/renewed-profile.plist" <<'PY'
          import hashlib
          import plistlib
          import subprocess
          import sys
          with open(sys.argv[1], "rb") as f:
              profile = plistlib.load(f)
          certificates = {
              hashlib.sha1(cert).hexdigest().upper()
              for cert in profile.get("DeveloperCertificates", [])
          }
          identities = subprocess.run(
              ["security", "find-identity", "-v", "-p", "codesigning"],
              capture_output=True, text=True, check=True
          ).stdout.upper()
          if not certificates or not any(cert in identities for cert in certificates):
              raise SystemExit("::error::Certificat Apple Distribution importé incompatible avec le profil.")
          print("Profil et certificat Apple Distribution compatibles.")
          PY
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/GaspardNZ-AppStore.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "Profil App Store renouvelé installé, capacités Push production confirmées."

      - name: Archiver l’application signée
        if: ${{ env.GNZ_RELEASE_UPLOAD == 'true' }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GaspardNZ.xcarchive" \
            -resultBundlePath "$RUNNER_TEMP/GaspardNZ-archive.xcresult" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER='GaspardNZ App Store Distribution' \
            2>&1 | tee "$RUNNER_TEMP/GaspardNZ-archive.log"

      - name: Conserver le diagnostic Xcode
        if: ${{ failure() && env.GNZ_RELEASE_UPLOAD == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: GaspardNZ-Xcode-diagnostic-${{ env.GNZ_RELEASE_BUILD }}
          path: |
            ${{ runner.temp }}/GaspardNZ-archive.log
            ${{ runner.temp }}/GaspardNZ-archive.xcresult
          if-no-files-found: warn
          retention-days: 7

      - name: Exporter l’IPA App Store
        if: ${{ env.GNZ_RELEASE_UPLOAD == 'true' }}
        run: |
          set -o pipefail
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c 'Set :signingStyle manual' ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c 'Add :signingCertificate string Apple Distribution' ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles:com.gaspardnz.app string GaspardNZ App Store Distribution' ios/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GaspardNZ.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ios/ExportOptions.plist \
            2>&1 | tee "$RUNNER_TEMP/GaspardNZ-export.log"

      - name: Conserver les erreurs d'export IPA
        if: ${{ failure() && env.GNZ_RELEASE_UPLOAD == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: GaspardNZ-IPA-export-diagnostic-${{ env.GNZ_RELEASE_BUILD }}
          path: ${{ runner.temp }}/GaspardNZ-export.log
          if-no-files-found: warn
          retention-days: 7

      - name: Vérifier la signature Push de l'IPA de distribution
        if: ${{ env.GNZ_RELEASE_UPLOAD == 'true' }}
        env:
          EXPECTED_VERSION: ${{ env.GNZ_RELEASE_VERSION }}
          EXPECTED_BUILD: ${{ env.GNZ_RELEASE_BUILD }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -f "$IPA_PATH"
          mkdir -p "$RUNNER_TEMP/ipa-inspection"
          unzip -q "$IPA_PATH" -d "$RUNNER_TEMP/ipa-inspection"
          APP_PATH="$(find "$RUNNER_TEMP/ipa-inspection/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          test -d "$APP_PATH"
          PROFILE_PATH="$APP_PATH/embedded.mobileprovision"
          test -f "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/distribution-profile.plist"
          PROFILE_APS="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/distribution-profile.plist")"
          if [ "$PROFILE_APS" != "production" ]; then
            echo "::error::Le profil de distribution IPA ne contient pas aps-environment=production"
            exit 1
          fi
          codesign --display --entitlements - --xml "$APP_PATH" > "$RUNNER_TEMP/distribution-entitlements.plist" 2>/dev/null
          SIGNATURE_APS="$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$RUNNER_TEMP/distribution-entitlements.plist")"
          if [ "$SIGNATURE_APS" != "production" ]; then
            echo "::error::La signature IPA ne contient pas aps-environment=production"
            exit 1
          fi
          ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          ACTUAL_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION" || { echo "::error::Version IPA incorrecte"; exit 1; }
          test "$ACTUAL_BUILD" = "$EXPECTED_BUILD" || { echo "::error::Numéro de build IPA incorrect"; exit 1; }
          echo "IPA validée: version $ACTUAL_VERSION, build $ACTUAL_BUILD, Push production actif."

      - name: Vérifier l’IPA
        if: ${{ env.GNZ_RELEASE_UPLOAD == 'true' }}
        run: |
          IPA_PATH="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -f "$IPA_PATH"
          xcrun altool --validate-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Envoyer vers TestFlight
        if: ${{ env.GNZ_RELEASE_UPLOAD == 'true' }}
        run: |
          IPA_PATH="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Conserver l’IPA
        if: ${{ env.GNZ_RELEASE_UPLOAD == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: GaspardNZ-iOS-${{ env.GNZ_RELEASE_VERSION }}-${{ env.GNZ_RELEASE_BUILD }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14

