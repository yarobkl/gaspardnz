name: iOS — Build et TestFlight

on:
  push:
    branches:
      - main
      - codex/ios-app-store
      - feature/ios-premium-interface
      - feature/native-ios-editorial
      - feature/build15-journal-editorial
    paths:
      - ".github/workflows/ios-testflight.yml"
      - "ios/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
  workflow_dispatch:
    inputs:
      version:
        description: "Version publique (ex. 1.0.0)"
        required: true
        default: "1.0.0"
      buildNumber:
        description: "Numéro de build App Store (entier croissant)"
        required: true
        default: "1"
      uploadToTestFlight:
        description: "Signer et envoyer vers TestFlight"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APP_BUNDLE_ID: com.gaspardnz.app
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Utiliser le Xcode stable le plus récent
        run: |
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -1)"
          test -n "$XCODE_APP"
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Construire et synchroniser Capacitor iOS
        run: npm run cap:sync:ios

      - name: Installer Python pour les icônes
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Préparer les icônes officielles GNZ sans transparence
        run: |
          python3 -m pip install Pillow
          python3 ios/scripts/prepare_app_icon.py

      - name: Appliquer la version iOS
        env:
          MARKETING_VERSION: ${{ inputs.version || '1.0.0' }}
          BUILD_NUMBER: ${{ inputs.buildNumber || '1' }}
        run: |
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $MARKETING_VERSION;/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj

      - name: Résoudre les dépendances Swift
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Compiler pour le simulateur
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.uploadToTestFlight }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Capturer l’écran d’accueil sur un simulateur iPhone
        id: capture
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.uploadToTestFlight }}
        timeout-minutes: 5
        continue-on-error: true
        run: |
          DEVICE_UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)["devices"]
          preferred=[]
          fallback=[]
          for runtime, devices in data.items():
              for device in devices:
                  if not device.get("isAvailable"): continue
                  row=(runtime, device["name"], device["udid"])
                  fallback.append(row)
                  if "iPhone 16 Pro Max" in device["name"]: preferred.append(row)
                  elif "iPhone" in device["name"] and "Pro Max" in device["name"]: preferred.append(row)
          rows=preferred or [r for r in fallback if "iPhone" in r[1]]
          print(sorted(rows, reverse=True)[0][2] if rows else "")')"
          test -n "$DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/App.app"
          test -d "$APP_PATH"
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_UDID" "$APP_BUNDLE_ID"
          sleep 8
          mkdir -p app-store-assets/screenshots
          xcrun simctl io "$DEVICE_UDID" screenshot app-store-assets/screenshots/iphone-home.png
          sips -g pixelWidth -g pixelHeight app-store-assets/screenshots/iphone-home.png

      - name: Conserver la capture App Store
        if: ${{ steps.capture.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: GaspardNZ-App-Store-Screenshot
          path: app-store-assets/screenshots/iphone-home.png
          if-no-files-found: error
          retention-days: 14

      - name: Vérifier les secrets Apple
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.uploadToTestFlight }}
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_APP_STORE_PROFILE_BASE64 }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY CERTIFICATE_P12 CERTIFICATE_PASSWORD PROFILE_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret manquant : $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Installer le certificat Apple Distribution
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.uploadToTestFlight }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Installer le profil App Store Connect
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.uploadToTestFlight }}
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_APP_STORE_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/GaspardNZ.mobileprovision"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          test "$PROFILE_NAME" = 'GaspardNZ App Store Distribution'
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Installer la clé App Store Connect
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.uploadToTestFlight }}
        run: |
          mkdir -p "$RUNNER_TEMP/appstoreconnect/private_keys" "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$RUNNER_TEMP/appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q '^-----BEGIN PRIVATE KEY-----'; then
            printf '%s' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          else
            printf '%s' "$ASC_PRIVATE_KEY" | tr -d '[:space:]' | openssl base64 -d -A > "$KEY_PATH"
          fi
          grep -q '^-----BEGIN PRIVATE KEY-----' "$KEY_PATH"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archiver l’application signée
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.uploadToTestFlight }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GaspardNZ.xcarchive" \
            -resultBundlePath "$RUNNER_TEMP/GaspardNZ-archive.xcresult" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            2>&1 | tee "$RUNNER_TEMP/GaspardNZ-archive.log"

      - name: Conserver le diagnostic Xcode
        if: ${{ failure() && github.event_name == 'workflow_dispatch' && inputs.uploadToTestFlight }}
        uses: actions/upload-artifact@v4
        with:
          name: GaspardNZ-Xcode-diagnostic-${{ inputs.buildNumber }}
          path: |
            ${{ runner.temp }}/GaspardNZ-archive.log
            ${{ runner.temp }}/GaspardNZ-archive.xcresult
          if-no-files-found: warn
          retention-days: 7

      - name: Exporter l’IPA App Store
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.uploadToTestFlight }}
        run: |
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c 'Set :signingStyle automatic' ios/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GaspardNZ.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Vérifier la signature Push de l'IPA de distribution
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.uploadToTestFlight }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_BUILD: ${{ inputs.buildNumber }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -f "$IPA_PATH"
          mkdir -p "$RUNNER_TEMP/ipa-inspection"
          unzip -q "$IPA_PATH" -d "$RUNNER_TEMP/ipa-inspection"
          APP_PATH="$(find "$RUNNER_TEMP/ipa-inspection/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          test -d "$APP_PATH"
          PROFILE_PATH="$APP_PATH/embedded.mobileprovision"
          test -f "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/distribution-profile.plist"
          PROFILE_APS="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/distribution-profile.plist")"
          if [ "$PROFILE_APS" != "production" ]; then
            echo "::error::Le profil de distribution IPA ne contient pas aps-environment=production"
            exit 1
          fi
          codesign -d --entitlements - "$APP_PATH" > "$RUNNER_TEMP/distribution-entitlements.plist" 2>/dev/null
          SIGNATURE_APS="$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$RUNNER_TEMP/distribution-entitlements.plist")"
          if [ "$SIGNATURE_APS" != "production" ]; then
            echo "::error::La signature IPA ne contient pas aps-environment=production"
            exit 1
          fi
          ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          ACTUAL_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION" || { echo "::error::Version IPA incorrecte"; exit 1; }
          test "$ACTUAL_BUILD" = "$EXPECTED_BUILD" || { echo "::error::Numéro de build IPA incorrect"; exit 1; }
          echo "IPA validée: version $ACTUAL_VERSION, build $ACTUAL_BUILD, Push production actif."

      - name: Vérifier l’IPA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.uploadToTestFlight }}
        run: |
          IPA_PATH="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -f "$IPA_PATH"
          xcrun altool --validate-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Envoyer vers TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.uploadToTestFlight }}
        run: |
          IPA_PATH="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Conserver l’IPA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.uploadToTestFlight }}
        uses: actions/upload-artifact@v4
        with:
          name: GaspardNZ-iOS-${{ inputs.version }}-${{ inputs.buildNumber }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14

