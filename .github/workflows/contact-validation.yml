name: Secure contact validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  contact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: node scripts/test-contact-database.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/contact-security.spec.js tests/e2e/booking-modal.spec.js tests/e2e/navigation.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contact-browser-results
          path: test-results/
