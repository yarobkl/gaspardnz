name: Validate GaspardNZ

on:
  push:
    branches:
      - main
      - "hardening/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Production dependency audit
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/npm-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          console.log('metadata.vulnerabilities=', JSON.stringify(report.metadata?.vulnerabilities || {}));
          for (const [name, v] of Object.entries(report.vulnerabilities || {})) {
            console.log(JSON.stringify({name, severity:v.severity, direct:v.isDirect, range:v.range, fixAvailable:v.fixAvailable}));
          }
          NODE
      - name: Lint when configured
        run: npm run lint --if-present
      - name: Run unit tests when configured
        run: npm test --if-present
      - name: Build web app
        run: npm run build
      - name: Validate SEO
        run: npm run test:seo
      - name: Validate email API security
        run: npm run test:email-security
      - name: Validate video accessibility
        run: npm run test:video-accessibility
      - name: Validate consent boundaries
        run: npm run test:consent
      - name: Verify dependency manifests stay unchanged
        run: git diff --exit-code -- package.json package-lock.json
