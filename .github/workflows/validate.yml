name: Validate GaspardNZ

on:
  push:
    branches:
      - main
      - "hardening/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint when configured
        run: npm run lint --if-present
      - name: Run unit tests when configured
        run: npm test --if-present
      - name: Build web app
        run: npm run build
      - name: Validate Capacitor bundle
        run: npm run test:bundle
      - name: Install Chromium for browser checks
        run: npx playwright-core install --with-deps chromium
      - name: Locate Chromium
        run: echo "CHROMIUM_PATH=$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux*/chrome' | head -n 1)" >> "$GITHUB_ENV"
      - name: Run browser checks on Claude HEAD
        run: npm run test:e2e
      - name: Validate SEO
        run: npm run test:seo
      - name: Validate email API security
        run: npm run test:email-security
      - name: Validate video accessibility
        run: npm run test:video-accessibility
      - name: Validate consent boundaries
        run: npm run test:consent
      - name: Verify dependency manifests stay unchanged
        run: git diff --exit-code -- package.json package-lock.json
      - name: Prove forged-cache exploit on pre-fix 2e1d0de
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 2e1d0de3762f4901296f3bd6896fda8d6ac505ee
          git checkout 2e1d0de3762f4901296f3bd6896fda8d6ac505ee -- src
          npm run build >/tmp/gaspardnz-base-build.log 2>&1
          npx vite preview --port 4210 --strictPort >/tmp/gaspardnz-base-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4210/ >/dev/null; then break; fi
            sleep 0.25
          done
          set +e
          BASE=http://127.0.0.1:4210 node scripts/browser-checks/admin-auth-scenarios.mjs 2>&1 | tee /tmp/base-auth.txt
          status=${PIPESTATUS[0]}
          set -e
          if ! grep -q '❌ D' /tmp/base-auth.txt; then
            echo 'Expected scenario D to reproduce the pre-fix forged-cache vulnerability, but it did not.'
            exit 1
          fi
          if [ "$status" -eq 0 ]; then
            echo 'Pre-fix suite unexpectedly passed despite the expected vulnerability.'
            exit 1
          fi
          echo 'Pre-fix vulnerability independently reproduced: scenario D fails as expected.'
