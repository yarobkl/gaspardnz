name: Validate GaspardNZ

on:
  push:
    branches:
      - main
      - "hardening/**"
      - "claude/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint when configured
        run: npm run lint --if-present

      - name: Run unit and static validation suites
        run: npm test

      - name: Start local PostgreSQL
        run: sudo systemctl start postgresql.service

      - name: Run RLS / audit / CRM SQL harness
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /tmp/gaspardnz-rls
          sudo cp -R "$GITHUB_WORKSPACE" /tmp/gaspardnz-rls
          sudo chown -R postgres:postgres /tmp/gaspardnz-rls
          sudo -u postgres bash /tmp/gaspardnz-rls/scripts/rls-harness/run.sh

      - name: Build web app
        run: npm run build

      - name: Validate generated SEO route HTML
        run: npm run test:seo-built

      - name: Validate Capacitor bundle after build
        run: npm run test:bundle

      - name: Install Chromium for browser checks
        run: npx playwright-core install --with-deps chromium

      - name: Locate Chromium
        shell: bash
        run: |
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux*/chrome' | head -n 1)"
          test -n "$CHROME"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"

      - name: Run browser checks
        run: npm run test:e2e

      - name: Verify dependency manifests stay unchanged
        run: git diff --exit-code -- package.json package-lock.json
