name: Deploy to Vercel

# Branche de validation GaspardNZ : utiliser le build précompilé officiel
# de Vercel, sans changer la production ni ses variables d'environnement.
# Cette variante n'est présente que sur la branche de test Cloudflare.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_GNZ_NOTIFICATION_API_ORIGIN: https://gaspardnz-notifications.eliebakala.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la branche de prévisualisation
        run: test "$GITHUB_REF_NAME" = "feature/gnz-cloudflare-testflight-20261118"

      - name: Vérifier les identifiants de déploiement existants
        run: test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Tester les fonctionnalités et permissions
        run: |
          npx vitest run --testTimeout=15000 --reporter=dot
          npm run test:admin-auth
          npm run test:rbac

      - name: Charger la configuration Vercel Preview
        run: npx --yes vercel@59.15.1 pull --yes --environment=preview --git-branch="$GITHUB_REF_NAME" --token="$VERCEL_TOKEN"

      - name: Construire la prévisualisation avec Cloudflare
        run: npx --yes vercel@59.15.1 build --token="$VERCEL_TOKEN"

      - name: Vérifier que le bundle cible bien Cloudflare
        run: rg -l --fixed-strings "gaspardnz-notifications.eliebakala.workers.dev" .vercel/output/static/assets

      - name: Publier uniquement la prévisualisation précompilée
        run: npx --yes vercel@59.15.1 deploy --prebuilt --yes --token="$VERCEL_TOKEN"
