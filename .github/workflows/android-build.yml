name: Android Capacitor Build
on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "Code de version (entier, doit augmenter à chaque upload Play Store)"
        required: false
        default: "3"
      versionName:
        description: "Nom de version visible (ex: 1.0)"
        required: false
        default: "1.0"
jobs:
  build-android:
    name: Build Android APK/AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Installer les dépendances
        run: npm install
      - name: Build web Capacitor
        run: npm run build:app
      - name: Ajouter ou synchroniser Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi
      - name: Générer les icônes de l'app (logo GNZ)
        run: npx @capacitor/assets generate --android
      - name: Définir le code et le nom de version
        env:
          VERSION_CODE: ${{ github.event.inputs.versionCode || '3' }}
          VERSION_NAME: ${{ github.event.inputs.versionName || '1.0' }}
        run: |
          sed -i "s/versionCode [0-9]\+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          echo "✅ versionCode=${VERSION_CODE} versionName=${VERSION_NAME}"
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Générer APK debug
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Générer AAB release non signé
        run: |
          cd android
          ./gradlew bundleRelease
      - name: Publier les fichiers Android
        uses: actions/upload-artifact@v4
        with:
          name: gaspardnz-android-builds
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
