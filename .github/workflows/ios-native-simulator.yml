name: iOS — Compilation simulateur (sans déploiement)

on:
  pull_request:
    paths:
      - "ios/App/App/**/*.swift"
      - "ios/App/App.xcodeproj/**"
      - "ios/App/App/*.plist"
      - ".github/workflows/ios-native-simulator.yml"

permissions:
  contents: read

jobs:
  build-simulator:
    name: Compiler GNZ PARIS sur iOS Simulator
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Choisir Xcode
        run: |
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -1)"
          test -n "$XCODE_APP"
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Synchroniser les ressources et plugins Capacitor
        run: npm run cap:sync:ios

      - name: Résoudre les dépendances Swift
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Compiler sans profil Apple ni signature
        run: |
          xcodebuild build -quiet \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Capturer l'accueil de GNZ PARIS sur iPhone simulé
        id: screenshot
        continue-on-error: true
        timeout-minutes: 5
        run: |
          DEVICE_UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for group in json.load(sys.stdin)["devices"].values() for d in group
                     if d.get("isAvailable") and "iPhone" in d["name"]]
          preferred = [d for d in devices if "Pro Max" in d["name"]]
          chosen = (preferred or devices)
          print(chosen[0]["udid"] if chosen else "")')"
          test -n "$DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl install "$DEVICE_UDID" "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$DEVICE_UDID" com.gaspardnz.app
          sleep 10
          mkdir -p artifacts
          xcrun simctl io "$DEVICE_UDID" screenshot artifacts/gnz-paris-iphone-home.png

      - name: Conserver la capture du simulateur
        if: ${{ steps.screenshot.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: GNZ-PARIS-iPhone-Accueil
          path: artifacts/gnz-paris-iphone-home.png
          retention-days: 7
