name: Android Signed Release (AAB)
on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "Code de version (entier, doit augmenter à chaque upload Play Store)"
        required: false
        default: "3"
      versionName:
        description: "Nom de version visible (ex: 1.0)"
        required: false
        default: "1.0"
jobs:
  build-signed-aab:
    name: Build Signed Android AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Installer les dépendances
        run: npm install
      - name: Build web Capacitor
        run: npm run build:app
      - name: Ajouter ou synchroniser Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi
      - name: Générer les icônes de l'app (logo GNZ)
        run: npx @capacitor/assets generate --android
      - name: Définir le code et le nom de version
        env:
          VERSION_CODE: ${{ github.event.inputs.versionCode || '3' }}
          VERSION_NAME: ${{ github.event.inputs.versionName || '1.0' }}
        run: |
          sed -i "s/versionCode [0-9]\+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          echo "✅ versionCode=${VERSION_CODE} versionName=${VERSION_NAME}"
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Décoder et vérifier le keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Nettoie tout espace/retour parasite introduit lors du collage du secret
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/upload-key.jks"
          echo "Taille du keystore décodé: $(wc -c < "$RUNNER_TEMP/upload-key.jks") octets"
          # Vérifie que le keystore est lisible AVANT le build (diagnostic clair si corrompu)
          if ! keytool -list -keystore "$RUNNER_TEMP/upload-key.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Keystore invalide ou mot de passe incorrect. Vérifie le secret ANDROID_KEYSTORE_BASE64 (collage complet, sans espace) et ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          echo "✅ Keystore valide et lisible"
      - name: Générer AAB release SIGNÉ
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload-key.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - name: Publier l'AAB signé
        uses: actions/upload-artifact@v4
        with:
          name: gaspardnz-signed-aab
          path: android/app/build/outputs/bundle/release/*.aab
